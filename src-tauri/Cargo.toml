[package]
name = "openzygor"
version = "0.1.0"
description = "A native Linux client for Zygor guide downloads"
edition = "2024"
license = "MIT"
default-run = "openzygor"

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:keyring", "dep:open"]
custom-protocol = ["tauri?/custom-protocol"]
# Explicit test builds can use a loopback fixture service. Release builds omit it.
e2e = ["desktop"]

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util", "net"] }
tokio-util = "0.7"
zeroize = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", optional = true }
rfd = { version = "0.15", optional = true }
keyring = { version = "3", optional = true, features = ["sync-secret-service", "crypto-rust"] }
open = { version = "5", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
axum = "0.8"

[[bin]]
name = "openzygor"
path = "src/main.rs"
required-features = ["desktop"]
